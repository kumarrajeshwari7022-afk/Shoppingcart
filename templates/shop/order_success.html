<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Successful - ShopEasy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🛍️ ShopEasy
        </a>

        <a href="{% url 'my_orders' %}"
           class="btn btn-light">
            My Orders
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow text-center">

        <div class="card-body p-5">

            <div class="display-1 mb-3">
                ✅
            </div>

            <h1 class="text-success">
                Order Placed Successfully!
            </h1>

            <p class="lead mt-3">
                Thank you for shopping with ShopEasy.
            </p>


            <div class="alert alert-info mt-4">

                <strong>
                    Order ID:
                </strong>

                #{{ order.id }}

                <br>

                <strong>
                    Total Amount:
                </strong>

                ₹{{ order.total_amount }}

                <br>

                <strong>
                    Status:
                </strong>

                {{ order.status }}

            </div>


            <div class="mt-4">

                <a
                    href="{% url 'my_orders' %}"
                    class="btn btn-primary me-2"
                >
                    📦 View My Orders
                </a>


                <a
                    href="{% url 'home' %}"
                    class="btn btn-success"
                >
                    🛍️ Continue Shopping
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
